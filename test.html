<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貿易実務検定C級 模擬試験｜贸易实务检定C级 模拟考试</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1c1b19; --muted:#6b6862; --line:#e4e1da;
    --accent:#2f5d50; --accent-soft:#e8f0ed;
    --ok:#1f7a4d; --ok-bg:#e8f5ee; --ng:#b3261e; --ng-bg:#fdeceb;
    --zh:#8a5a2b; --zh-bg:#fbf6ef; --warn:#8a6d1f; --warn-bg:#fdf6e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px; line-height:1.85; -webkit-text-size-adjust:100%;
  }
  ruby{ruby-position:over}
  rt{font-size:.52em; color:var(--muted); font-weight:400; letter-spacing:.02em}
  .jp{line-height:2.5}
  b{font-weight:700}

  header{
    position:sticky; top:0; z-index:20; background:rgba(246,245,242,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .hwrap{max-width:960px; margin:0 auto; padding:10px 18px 0}
  .htop{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .htitle{font-size:15px; font-weight:700; letter-spacing:.01em}
  .hsub{font-size:12px; color:var(--muted)}
  .hstat{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .hstat b{color:var(--ink)}
  .bar{height:4px; background:var(--line); border-radius:99px; margin:9px 0 0; overflow:hidden}
  .bar>i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
  .chips{display:flex; gap:6px; padding:9px 0 10px; flex-wrap:wrap}
  .chip{
    font-size:12px; padding:3px 10px; border:1px solid var(--line); border-radius:99px;
    background:#fff; color:var(--muted); cursor:pointer; white-space:nowrap; line-height:1.6;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip.book{border-color:#e8c9c6; color:var(--ng)}
  .chip.book.on{background:var(--ng); border-color:var(--ng); color:#fff}
  .chip.set{margin-left:auto; border-style:dashed}
  .chip.set.act{background:var(--warn-bg); border-color:#e0c979; border-style:solid; color:#6b551a; font-weight:700}

  main{max-width:960px; margin:0 auto; padding:22px 18px 90px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 24px; box-shadow:0 1px 2px rgba(0,0,0,.03)}

  .meta{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap}
  .badge{background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 9px; font-weight:700}
  .badge.ngb{background:var(--ng-bg); color:var(--ng)}
  .badge.okb{background:var(--ok-bg); color:var(--ok)}
  .qno{font-weight:700; color:var(--ink); font-size:13px}

  .qjp{font-size:17px; line-height:2.5}
  .zh{
    margin-top:12px; background:var(--zh-bg); border-left:3px solid #d9c3a3;
    padding:9px 14px; border-radius:0 8px 8px 0; color:#4a4238; font-size:14.5px; line-height:1.9;
  }
  .zh::before{content:"中"; display:inline-block; font-size:10px; font-weight:700; color:#fff;
    background:var(--zh); border-radius:4px; padding:0 5px; margin-right:8px; vertical-align:2px; line-height:1.6}
  .ptitle{font-weight:700; margin-bottom:6px; font-size:15px}
  .ptitle-zh{font-weight:700; margin-bottom:4px}
  .blank{background:#eef1ef; border-bottom:2px solid #b9c6c0; border-radius:4px; padding:0 2px; white-space:nowrap}
  .blank.cur{background:#fff2c8; border-bottom:2px solid #e0a800; font-weight:700}
  .prompt{margin-top:16px; font-size:15px; font-weight:600}
  .prompt .zh{margin-top:6px; font-weight:400}

  .opts{margin-top:18px; display:grid; gap:9px}
  .opts.wide{grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:7px}
  .opt{
    display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
    background:#fff; border:1.5px solid var(--line); border-radius:11px; padding:12px 15px;
    cursor:pointer; font:inherit; color:inherit; line-height:2.2; transition:border-color .12s, background .12s;
  }
  .opts.wide .opt{padding:9px 11px; line-height:2; font-size:14.5px; align-items:center}
  .opt:hover:not(:disabled){border-color:var(--accent); background:#fbfdfc}
  .opt:disabled{cursor:default}
  .key{
    flex:none; width:24px; height:24px; border-radius:7px; background:#f0efec; color:var(--muted);
    font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:5px; line-height:1;
  }
  .opts.wide .key{margin-top:0; width:21px; height:21px; font-size:11px}
  .otext{flex:1; min-width:0}
  .ozh{display:block; font-size:12.5px; color:#8a7f70; line-height:1.65; margin-top:1px}
  .opts.wide .ozh{font-size:11.5px}
  .ox{font-size:19px; font-weight:700; vertical-align:-1px}

  .opt.correct{border-color:var(--ok); background:var(--ok-bg)}
  .opt.correct .key{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--ng); background:var(--ng-bg)}
  .opt.wrong .key{background:var(--ng); color:#fff}
  .opt.dim{opacity:.82; background:#fafaf8}
  .mark{flex:none; font-size:15px; font-weight:700; margin-top:4px}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong .mark{color:var(--ng)}

  .fb{margin-top:20px; border-radius:12px; padding:14px 18px; border:1px solid}
  .fb.ok{background:var(--ok-bg); border-color:#bfe0cd}
  .fb.ng{background:var(--ng-bg); border-color:#f3ccc9}
  .fbhead{font-weight:700; font-size:15px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .fb.ok .fbhead{color:var(--ok)} .fb.ng .fbhead{color:var(--ng)}
  .fbhead small{font-weight:500; color:var(--muted); font-size:12.5px}

  .exp{margin-top:14px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px}
  .exph{font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.06em; margin-bottom:8px}
  .expjp{font-size:15px; line-height:2.45}

  nav.foot{
    position:fixed; left:0; right:0; bottom:0; background:rgba(246,245,242,.95);
    backdrop-filter:blur(8px); border-top:1px solid var(--line); z-index:20;
  }
  .fwrap{max-width:960px; margin:0 auto; padding:11px 18px; display:flex; gap:10px; align-items:center}
  button.btn{
    font:inherit; font-size:14px; border-radius:10px; padding:9px 20px; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); line-height:1.5;
  }
  button.btn:hover{border-color:var(--accent); color:var(--accent)}
  button.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
  button.btn.pri:hover{filter:brightness(1.12); color:#fff}
  button.btn.sm{font-size:12.5px; padding:5px 12px; border-radius:8px}
  button.btn.danger{color:var(--ng); border-color:#e8c9c6}
  button.btn.danger:hover{background:var(--ng); border-color:var(--ng); color:#fff}
  button.btn:disabled{opacity:.4; cursor:default}
  button.btn:disabled:hover{border-color:var(--line); color:var(--ink)}
  .spacer{flex:1}
  .hint{font-size:11.5px; color:var(--muted)}
  .row{display:flex; gap:9px; flex-wrap:wrap; align-items:center}

  /* 結果 */
  .res h2, .bk h2{font-size:22px; margin:0 0 4px}
  .res .sub, .bk .sub{color:var(--muted); font-size:13px; margin-bottom:20px}
  .big{font-size:44px; font-weight:800; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums}
  .big small{font-size:16px; color:var(--muted); font-weight:500}
  .tbl{width:100%; border-collapse:collapse; margin:18px 0; font-size:14px}
  .tbl th,.tbl td{border-bottom:1px solid var(--line); padding:9px 8px; text-align:left}
  .tbl th{font-size:12px; color:var(--muted); font-weight:600}
  .tbl td.num{text-align:right; font-variant-numeric:tabular-nums}
  .grid{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
  .cellbtn{
    width:34px; height:30px; border-radius:7px; border:1px solid var(--line); background:#fff;
    font:inherit; font-size:11.5px; cursor:pointer; display:grid; place-items:center; color:var(--muted);
  }
  .cellbtn.ok{background:var(--ok-bg); border-color:#bfe0cd; color:var(--ok); font-weight:700}
  .cellbtn.ng{background:var(--ng-bg); border-color:#f3ccc9; color:var(--ng); font-weight:700}
  .gsec{font-size:11.5px; color:var(--muted); margin:12px 0 2px; font-weight:600}
  .note{font-size:12px; color:var(--muted); margin-top:22px; line-height:1.75}

  /* 錯題本 */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:4px 0 18px}
  .kpi{background:#faf9f7; border:1px solid var(--line); border-radius:11px; padding:11px 13px}
  .kpi .v{font-size:24px; font-weight:800; line-height:1.2; font-variant-numeric:tabular-nums}
  .kpi .k{font-size:11.5px; color:var(--muted); line-height:1.5}
  .kpi.ngk .v{color:var(--ng)} .kpi.okk .v{color:var(--ok)}
  .banner{background:var(--warn-bg); border:1px solid #ecdca6; color:#6b551a; border-radius:11px;
    padding:10px 14px; font-size:12.5px; line-height:1.7; margin-bottom:16px}
  .bkgrp{font-size:12px; font-weight:700; color:var(--accent); margin:20px 0 7px; letter-spacing:.03em}
  .bkrow{border:1px solid var(--line); border-radius:11px; padding:11px 14px; margin-bottom:7px; background:#fff}
  .bkrow.grad{background:#fafaf8}
  .bkhead{display:flex; gap:9px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--muted)}
  .bkhead .n{font-weight:700; color:var(--ink); font-size:12.5px}
  .tally{font-variant-numeric:tabular-nums}
  .tally .w{color:var(--ng); font-weight:700} .tally .r{color:var(--ok); font-weight:700}
  .dots{letter-spacing:2px}
  .bkq{font-size:14.5px; line-height:2.15; margin-top:3px}
  .bkzh{font-size:12.5px; color:#8a7f70; line-height:1.65}
  .bkacts{display:flex; gap:7px; margin-top:8px; flex-wrap:wrap}
  .empty{text-align:center; color:var(--muted); padding:34px 10px; font-size:14px; line-height:2}
  .empty .em{font-size:34px; display:block; margin-bottom:6px}
  .hist{font-size:12.5px; color:var(--muted); line-height:2}
  .hist span{font-variant-numeric:tabular-nums}
  details.fold{margin-top:8px}
  details.fold>summary{cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:600; list-style:none}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:"▸ "}
  details.fold[open]>summary::before{content:"▾ "}
  .dz{border:1px dashed var(--line); border-radius:11px; padding:12px 14px; margin-top:12px; font-size:12.5px; color:var(--muted); line-height:1.9}

  /* 貿易英語 */
  .enterm{font-size:26px; font-weight:700; line-height:1.5; font-family:Georgia,"Times New Roman",serif}
  .enterm .mk{color:var(--muted); font-size:16px; font-weight:600; margin-right:8px}
  .enterm.sm{font-size:15.5px; font-weight:600}
  .ensent{font-size:18px; line-height:1.9; font-family:Georgia,"Times New Roman",serif}
  .ensent.sm{font-size:14px; line-height:1.7}
  .enq{font-family:Georgia,serif; color:var(--muted); font-size:13px}
  .trans{background:var(--accent-soft); border-radius:9px; padding:9px 13px; margin-bottom:12px; font-size:15px; line-height:2.3}
  .vocab{width:100%; border-collapse:collapse; margin-top:15px; font-size:13.5px}
  .vocab th{font-size:11px; color:var(--muted); text-align:left; border-bottom:1px solid var(--line); padding:5px 8px; font-weight:600}
  .vocab td{border-bottom:1px solid #f2f0eb; padding:6px 8px; vertical-align:top; line-height:1.9}
  .vocab .ven{font-family:Georgia,serif; width:34%}
  .vocab .vjp{width:33%; line-height:2.25}
  .vocab .vzh{color:#8a7f70; width:33%}

  /* 船荷証券 */
  .doc{border:1.5px solid #cfc9be; border-radius:10px; background:#fffdf8; font-size:12.5px;
       line-height:1.55; overflow:hidden; margin-bottom:18px}
  .dochead{display:flex; justify-content:space-between; gap:12px; padding:10px 13px;
           border-bottom:1.5px solid #cfc9be; background:#f6f2e8; font-family:Georgia,serif}
  .docsub{font-size:11px; color:var(--muted)}
  .docno{text-align:right; font-size:11px; color:var(--muted); white-space:nowrap}
  .docno b{font-size:14px; color:var(--ink)}
  .docgrid{display:grid; grid-template-columns:repeat(6,1fr)}
  .docbox{border-right:1px solid #e3ddd0; border-bottom:1px solid #e3ddd0; padding:6px 9px; min-height:58px}
  .doclab{font-size:9.5px; color:#948d80; line-height:1.45; font-family:Georgia,serif}
  .doclab span{display:block; font-size:9.5px; color:#b3aa99;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
  .docval{margin-top:3px; font-size:12.5px; font-weight:700; color:var(--ink);
    font-family:"SFMono-Regular",Menlo,Consolas,monospace; line-height:1.6}
  .doctbl{width:100%; border-collapse:collapse}
  .doctbl th{font-size:9.5px; color:#948d80; text-align:left; padding:6px 9px; font-weight:400;
    border-right:1px solid #e3ddd0; border-bottom:1px solid #e3ddd0; font-family:Georgia,serif; vertical-align:top}
  .doctbl th span{display:block; font-size:9.5px; color:#b3aa99;
    font-family:"Noto Sans SC","PingFang SC",sans-serif}
  .doctbl td{padding:8px 9px; border-right:1px solid #e3ddd0; vertical-align:top; font-size:12px;
    line-height:1.75; font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .docside{font-size:9.5px; color:#b3aa99; padding:5px 9px 0}
  .docfreight{padding:5px 9px 10px; font-weight:700; letter-spacing:.05em;
    font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .docfoot{text-align:center; color:var(--muted); font-size:11px; padding-bottom:9px}
  .docterms{border-top:1px solid #e3ddd0; padding:9px 13px; margin:0}
  .docterms .ten{font-family:Georgia,serif; font-size:12px; line-height:1.75; margin:9px 0 3px}
  .docterms .tzh{font-size:12px; color:#8a7f70; line-height:1.85; margin:0 0 4px}

  .notice{max-width:960px; margin:14px auto -6px; padding:0 18px}
  .nbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-radius:11px;
    padding:9px 14px; font-size:12.5px; line-height:1.7; margin-bottom:8px}
  .nbar.info{background:var(--accent-soft); border:1px solid #c9dcd4; color:#20463c}
  .nbar.warn{background:var(--warn-bg); border:1px solid #ecdca6; color:#6b551a}
  .nbar b{font-weight:700}
  .nbar .sp{flex:1}
  .nx{background:none; border:0; font:inherit; color:inherit; opacity:.55; cursor:pointer; padding:0 2px; font-size:15px}
  .nx:hover{opacity:1}
  .btn.rst{border-color:#e0c979; color:#8a6d1f}
  .btn.rst:hover{background:var(--warn-bg); border-color:#c9a63a; color:#6b551a}
  .btn.rst.arm{background:var(--ng); border-color:var(--ng); color:#fff}
  .btn.rst.arm:hover{background:var(--ng); color:#fff}
  .saved{font-size:11px; color:var(--muted); white-space:nowrap}
  @media (max-width:640px){
    .hint{display:none} .saved{display:none}
    .notice{padding:0 12px}
    .fwrap{gap:7px; padding:9px 10px}
    button.btn{padding:9px 13px; font-size:13.5px; white-space:nowrap}
    .nbar{font-size:12px; padding:8px 11px}
  }
  /* 語群選択：文章内の空欄 */
  .blk{background:#eef1ef; border-bottom:2px solid #b9c6c0; border-radius:4px; padding:0 4px; white-space:nowrap}
  .blk.cur{background:#fff2c8; border-bottom:2px solid #e0a800; font-weight:700; box-shadow:0 0 0 2px #ffe9a8}
  .blk.clk{cursor:pointer}
  .blk.clk:hover{background:#ffe9a8}
  .blk.filled{white-space:normal; padding:1px 7px; border-radius:6px; font-weight:600}
  .blk.ok{background:var(--ok-bg); border-bottom:2px solid var(--ok); color:#12603a}
  .blk.ng{background:var(--ng-bg); border-bottom:2px solid var(--ng); color:#8f1c16}
  .blk.un{background:var(--warn-bg); border-bottom:2px solid #c9a63a; color:#6b551a}
  .blk .bmk{font-size:.7em; color:var(--muted); margin-right:4px; font-weight:400}
  .blk s{opacity:.6; font-weight:400}
  .blk .arw{margin:0 5px; opacity:.55}
  .blk .cor{color:var(--ok)}
  .bexp{border-left:3px solid var(--line); padding:2px 0 2px 13px; margin:15px 0}
  .bexp.ok{border-color:var(--ok)} .bexp.ng{border-color:var(--ng)} .bexp.un{border-color:#c9a63a}
  .bexph{font-weight:700; font-size:13.5px; margin-bottom:3px; line-height:2}
  .bexp.ok .bexph{color:var(--ok)} .bexp.ng .bexph{color:var(--ng)} .bexp.un .bexph{color:#8a6d1f}
  .bexph small{font-weight:500; color:var(--muted); font-size:12.5px; margin-left:8px}
  .opt.used{background:#f4f6f5; border-style:dashed}
  .mark.used{color:var(--accent); font-size:13px}
  .mprog{margin-top:15px; font-size:13.5px; color:var(--muted); font-weight:600}
  .mprog b{color:var(--accent)}
  .mprog .cue{color:#8a6d1f}
  .btn.unsure{width:100%; margin-top:11px; border-style:dashed; border-color:#e0c979;
    background:#fffdf5; color:#8a6d1f; font-weight:600}
  .btn.unsure:hover{background:var(--warn-bg); border-color:#c9a63a; color:#6b551a}
  .fb.un{background:var(--warn-bg); border-color:#ecdca6}
  .fb.un .fbhead{color:#8a6d1f}
  .cellbtn.un{background:var(--warn-bg); border-color:#ecdca6; color:#8a6d1f; font-weight:700}
  .tally .u{color:#8a6d1f; font-weight:700}
  .kpi.unk .v{color:#8a6d1f}
  .verdict{display:inline-block; border-radius:8px; padding:3px 12px; font-size:13px; font-weight:700; margin-left:10px}
  .verdict.pass{background:var(--ok-bg); color:var(--ok)}
  .verdict.fail{background:var(--ng-bg); color:var(--ng)}
  .tbl tr.subj td{background:#faf9f7; font-weight:700}
  .tbl tr.tot td{border-top:2px solid var(--line); font-weight:800}
  .tbl tr.exrow td{background:var(--accent-soft); font-weight:800; color:var(--accent)}
  .badge.ex{background:#eef0f6; color:#4a5570}
  .h2sub{font-size:13px; font-weight:600; color:var(--muted); margin-left:10px; vertical-align:2px}
  .chip.set.exsel{border-style:solid; background:#f3f4f8; color:#4a5570; border-color:#dcdfe8}
  .chip.set.exsel:disabled{cursor:default; opacity:1}
  .chip.set.exsel.act{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip.set.exsel + .chip.set{margin-left:0}
  .exhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:22px 0 4px;
    padding:7px 12px; background:var(--accent-soft); border-radius:9px; font-weight:700; color:var(--accent); font-size:13.5px}
  .exhead span{flex:1}

  @media (max-width:640px){
    main{padding:16px 12px 92px} .card{padding:17px 15px; border-radius:12px}
    .qjp{font-size:16px} .hwrap{padding:9px 12px 0} .fwrap{padding:10px 12px}
    .opts.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    button.btn{padding:9px 15px}
    .docgrid{grid-template-columns:repeat(2,1fr)}
    .docbox{grid-column:span 2 !important; min-height:0}
    .doctbl thead{display:none}
    .doctbl td{display:block; width:100%; border-right:0; border-bottom:1px solid #e3ddd0}
    .enterm{font-size:21px} .ensent{font-size:16px}
    .vocab .ven,.vocab .vjp,.vocab .vzh{width:auto}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">

り</rt></ruby><ruby>銀行<rt>ぎんこう</rt></ruby>", "zh": "议付银行"}, {"html": "CIDG", "zh": "CIDG（无此惯用术语，干扰项）"}, {"html": "パーチェス・オーダー", "zh": "Purchase Order（订购单）"}, {"html": "CISG", "zh": "CISG（联合国国际货物销售合同公约）"}, {"html": "<ruby>国際<rt>こくさい</rt></ruby><ruby>私法<rt>しほう</rt></ruby>（<ruby>適用<rt>てきよう</rt></ruby>される<ruby>国内法<rt>こくないほう</rt></ruby>）", "zh": "国际私法（所适用的国内法）"}, {"html": "リリース・オーダー", "zh": "Release Order（放货指示书）"}, {"html": "<ruby>金額的<rt>きんがくてき</rt></ruby>", "zh": "金额上的"}, {"html": "<ruby>有価証券<rt>ゆうかしょうけん</rt></ruby>", "zh": "有价证券"}, {"html": "FORWARD", "zh": "FORWARD（远期）"}, {"html": "RCEP", "zh": "RCEP（区域全面经济伙伴关系协定）"}, {"html": "<ruby>船積<rt>ふなづみ</rt></ruby><ruby>式<rt>しき</rt></ruby>", "zh": "装船式"}, {"html": "キャッチオール<ruby>規制<rt>きせい</rt></ruby>", "zh": "全面管制（Catch-all 管制）"}, {"html": "CIF", "zh": "CIF（成本加保险费加运费）"}, {"html": "ドック・レシート", "zh": "Dock Receipt（场站收据）"}, {"html": "カーゴ・ボートノート", "zh": "Cargo Boat Note（货物交接单）"}, {"html": "<ruby>取立<rt>とりたて</rt></ruby><ruby>銀行<rt>ぎんこう</rt></ruby>", "zh": "托收银行"}, {"html": "Parol Evidence Rule", "zh": "口头证据规则"}, {"html": "<ruby>当事者<rt>とうじしゃ</rt></ruby>の<ruby>合意<rt>ごうい</rt></ruby>", "zh": "当事人的约定（合意）"}, {"html": "Entire Agreement", "zh": "完整协议条款"}], "keys": ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"], "sJp": "(2) <ruby>外国為替<rt>がいこくかわせ</rt></ruby><ruby>相場<rt>そうば</rt></ruby>について　空欄 ⑤〜⑦", "sZh": "(2) 关于外汇汇率 空格 ⑤〜⑦", "wide": true}, {"id": "111/3-P3", "exam": "111", "sec": 3, "no": 3, "pts": 9.0, "multi": true, "blanks": [{"no": 8, "mark": "⑧", "ans": 11, "eHtml": "<ruby>公式<rt>こうしき</rt></ruby><ruby>解答<rt>かいとう</rt></ruby>では、⑧に<ruby>国際<rt>こくさい</rt></ruby><ruby>私法<rt>しほう</rt></ruby>（<ruby>適用<rt>てきよう</rt></ruby>される<ruby>国内法<rt>こくないほう</rt></ruby>）が<ruby>入<rt>い</rt></ruby>る。【<ruby>補足<rt>ほそく</rt></ruby>】<ruby>実務<rt>じつむ</rt></ruby><ruby>上<rt>じょう</rt></ruby>の<ruby>理解<rt>りかい</rt></ruby>としては、まず<ruby>当事者<rt>とうじしゃ</rt></ruby>の<ruby>合意<rt>ごうい</rt></ruby>が<ruby>優先<rt>ゆうせん</rt></ruby>し、<ruby>合意<rt>ごうい</rt></ruby>がない<ruby>部分<rt>ぶぶん</rt></ruby>にCISGが<ruby>適用<rt>てきよう</rt></ruby>され、CISGでも<ruby>解決<rt>かいけつ</rt></ruby>できない<ruby>事項<rt>じこう</rt></ruby>は<ruby>国際<rt>こくさい</rt></ruby><ruby>私法<rt>しほう</rt></ruby>により<ruby>指定<rt>してい</rt></ruby>される<ruby>国内法<rt>こくないほう</rt></ruby>によることになる。", "eZh": "官方答案中，⑧填「国际私法（所适用的国内法）」。【补充】从实务理解上说：首先以当事人的约定优先；约定未涉及的部分适用 CISG；CISG 仍无法解决的事项，则依国际私法所指定的国内法处理。"}, {"no": 9, "mark": "⑨", "ans": 24, "eHtml": "<ruby>公式<rt>こうしき</rt></ruby><ruby>解答<rt>かいとう</rt></ruby>では、⑨に<ruby>当事者<rt>とうじしゃ</rt></ruby>の<ruby>合意<rt>ごうい</rt></ruby>が<ruby>入<rt>い</rt></ruby>る。ウィーン<ruby>売買<rt>ばいばい</rt></ruby><ruby>条約<rt>じょうやく</rt></ruby>（CISG）は<ruby>任意<rt>にんい</rt></ruby><ruby>規定<rt>きてい</rt></ruby>であり、<ruby>当事者<rt>とうじしゃ</rt></ruby>が<ruby>条約<rt>じょうやく</rt></ruby>の<ruby>適用<rt>てきよう</rt></ruby>を<ruby>排除<rt>はいじょ</rt></ruby>したり、その<ruby>効果<rt>こうか</rt></ruby>を<ruby>変更<rt>へんこう</rt></ruby>したりすることができる。", "eZh": "官方答案中，⑨填「当事人的约定（合意）」。维也纳销售公约（CISG）属任意性规定，当事人可以排除公约的适用，或变更其效力。"}, {"no": 10, "mark": "⑩", "ans": 10, "eHtml": "<ruby>公式<rt>こうしき</rt></ruby><ruby>解答<rt>かいとう</rt></ruby>では、⑩にCISGが<ruby>入<rt>い</rt></ruby>る。CISGはウィーン<ruby>売買<rt>ばいばい</rt></ruby><ruby>条約<rt>じょうやく</rt></ruby>（<ruby>正式名称<rt>せいしきめいしょう</rt></ruby>「<ruby>国際<rt>こくさい</rt></ruby><ruby>物品<rt>ぶっぴん</rt></ruby><ruby>売買契約<rt>ばいばいけいやく</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>国際<rt>こくさい</rt></ruby><ruby>連合<rt>れんごう</rt></ruby><ruby>条約<rt>じょうやく</rt></ruby>」）の<ruby>略称<rt>りゃくしょう</rt></ruby>である。", "eZh": "官方答案中，⑩填「CISG」。CISG 是维也纳销售公约（正式名称《联合国国际货物销售合同公约》）的简称。"}], "rng": "⑧〜⑩", "qHtml": "<div class=\"ptitle\">(3) ウィーン<ruby>売買<rt>ばいばい</rt></ruby><ruby>条約<rt>じょうやく</rt></ruby>の<ruby>適用<rt>てきよう</rt></ruby>について</div>ウィーン<ruby>売買<rt>ばいばい</rt></ruby><ruby>条約<rt>じょうやく</rt></ruby><ruby>加入国間<rt>かにゅうこくかん</rt></ruby>の<ruby>売買契約<rt>ばいばいけいやく</rt></ruby>における<ruby>規定<rt>きてい</rt></ruby>の<ruby>適用<rt>てきよう</rt></ruby>は、<span class=\"blk\" data-b=\"8\"></span>、<span class=\"blk\" data-b=\"9\"></span>、<span class=\"blk\" data-b=\"10\" >いたまま<ruby>輸出<rt>ゆしゅつ</rt></ruby><ruby>申告<rt>しんこく</rt></ruby>から<ruby>輸出<rt>ゆしゅつ</rt></ruby><ruby>許可<rt>きょか</rt></ruby>を<ruby>受<rt>う</rt></ruby>けるまでの<ruby>手続<rt>てつづき</rt></ruby>が<ruby>可能<rt>かのう</rt></ruby>である（<ruby>選択肢<rt>せんたくし</rt></ruby>@1@：<ruby>正<rt>ただ</rt></ruby>しい）。", "eZh": "选项@2@错误：特例委托进口者是指把进口报关委托给「认定报关业者」的进口商本身；题干描述的其实是认定报关业者。选项@0@正确：取得特例进口者认可后可分离办理进口申报与纳税申报，纳税申报在取得进口许可之日所属月份的次月末日前完成即可。选项@1@正确。", "sJp": "<ruby>次<rt>つぎ</rt></ruby>の<ruby>記述<rt>きじゅつ</rt></ruby>はAEO<ruby>制度<rt>せいど</rt></ruby>に<ruby>関<rt>かん</rt></ruby>するものであるが、<ruby>誤<rt>あやま</rt></ruby>っているものはどれか。", "sZh": "以下关于 AEO 制度的叙述中，错误的是哪一项？", "wide": false}, {"id": "111/4-15", "exam": "111", "sec": 4, "no": 15, "pts": 3.0, "qHtml": "<ruby>次<rt>つぎ</rt></ruby>の<ruby>記述<rt>きじゅつ</rt></ruby>は、サレンダーB/Lに<ruby>関<rt>かん</rt></ruby>するものであるが、<ruby>誤<rt>あやま</rt></ruby>っているものはどれか。", "qZh": "以下关于电放提单（Surrendered B/L）的叙述中，错误的是哪一项？", "opts": [{"html": "サレンダーB/Lの<ruby>場合<rt>ばあい</rt></ruby>、<ruby>輸出<rt>ゆしゅつ</rt></ruby><ruby>地<rt>ち</rt></ruby>の<ruby>船会社<rt>ふながいしゃ</rt></ruby>が、<ruby>発行<rt>はっこう</rt></ruby>したB/L<ruby>全通<rt>ぜんつう</rt></ruby>に<ruby>輸出者<rt>ゆしゅつしゃ</rt></ruby>の<ruby>白地<rt>しらじ</rt></ruby><ruby>裏書<rt>うらがき</rt></ruby>を<ruby>受<rt>う</rt></ruby>けて<ruby>回収<rt>かいしゅう</rt></ruby>し、「<ruby>回収<rt>かいしゅう</rt></ruby><ruby>済<rt>す</rt></ruby>み（Surrendered）」のスタンプを<ruby>押<rt>お</rt></ruby>して、そのコピーを<ruby>輸出者<rt>ゆしゅつしゃ</rt></ruby>に<ruby>渡<rt>わた</rt></ruby>す。<ruby>輸出者<rt>ゆしゅつしゃ</rt></ruby>からそのコピーを<ruby>受<rt>う</rt></ruby>け<ruby>取<rt>と</rt></ruby>った<ruby>輸入者<rt>ゆにゅうしゃ</rt></ruby>はそのコピーで<ruby>船会社<rt>ふながいしゃ</rt></ruby>から<ruby>貨物<rt>かもつ</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>き<ruby>取<rt>と</rt></ruby>る。", "zh": "电放提单的场合，出口地船公司取得出口商在全套已签发提单上的空白背书后予以收回，加盖「已收回（Surrendered）」印章，并把复印件交给出口商；进口商从出口商处收到该复印件后，凭它向船公司提货。"}, {"html": "サレンダーB/Lは、<ruby>信用状<rt>しんようじょう</rt></ruby><ruby>取引<rt>とりひき</rt></ruby>の<ruby>場合<rt>ばあい</rt></ruby>でも<ruby>使用<rt>しよう</rt></ruby>するのが<ruby>一般的<rt>いっぱんてき</rt></ruby>である。", "zh": "电放提单在信用证交易的场合也普遍使用。"}, {"html": "サレンダーB/Lによる<ruby>貨物<r 証明<rt>けんさしょうめい</rt></ruby><ruby>書<rt>かき</rt></ruby>の<ruby>料金<rt>りょうきん</rt></ruby>を<ruby>含<rt>ふく</rt></ruby>めて1,520<ruby>米<rt>べい</rt></ruby>ドルとなります。1,250<ruby>米<rt>べい</rt></ruby>ドルではありませんのでお<ruby>気<rt>き</rt></ruby>をつけください。", "zh": "发票开具手续费以外的追加费用，含品质检验证明书费用在内为 1,520 美元，并非 1,250 美元，敬请留意。"}, {"html": "<ruby>品質<rt>ひんしつ</rt></ruby><ruby>検査証明<rt>けんさしょうめい</rt></ruby><ruby>書<rt>かき</rt></ruby><ruby>手数料<rt>てすうりょう</rt></ruby>が1,250<ruby>米<rt>べい</rt></ruby>ドルではなく1,520<ruby>米<rt>べい</rt></ruby>ドルになり、インボイス<ruby>価額<rt>かがく</rt></ruby>に<ruby>追加<rt>ついか</rt></ruby><ruby>費用<rt>ひよう</rt></ruby>として<ruby>計上<rt>けいじょう</rt></ruby>されたことをお<ruby>知<rt>し</rt></ruby>らせしなければなりません。", "zh": "谨此告知：品质检验证明书手续费由 1,250 美元变为 1,520 美元，并作为追加费用计入了发票金额。"}], "ans": 0, "eHtml": "<div class=\"trans\"><b>【和訳】</b>インボイス<ruby>価格<rt>かかく</rt></ruby><ruby>以外<rt>いがい</rt></ruby>の<ruby>追加<rt>ついか</rt></ruby><ruby>請求<rt>せいきゅう</rt></ruby><ruby>費用<rt>ひよう</rt></ruby>は<ruby>品質<rt>ひんしつ</rt></ruby><ruby>検査証明<rt>けんさしょうめい</rt></ruby><ruby>書<rt>かき</rt></ruby>の<ruby>料金<rt>りょうきん</rt></ruby>を<ruby>含<rt>ふく</rt></ruby>めて、1,250<ruby>米<rt>べい</rt></ruby>ドルではなく、1,520<ruby>米<rt>べい</rt></ruby>ドルですのでお<ruby>間違<rt>まちが</rt></ruby>えの<ruby>無<rt>な</rt></ruby>いようにお<ruby>願<rt>ねが</rt></ruby>いいたします。</div>not … but ～ は「…ではなく～」。other than the invoice value は「インボイス<ruby>価額<rt>かがく</rt></ruby><ruby>以外<rt>いがい</rt></ruby>の」であり、Bの「インボイス<ruby>発行手数料<rt>はっこうてすうりょう</rt></ruby><ruby>以外<rt>いがい</rt></ruby>の」は<ruby>誤<rt>あやま</rt></ruby>り。Cは 1,250／1,520 <ruby>米<rt>べい</rt></ruby>ドルを「<ruby>品質<rt>ひんしつ</rt></ruby><ruby>検査証明<rt>けんさしょうめい</rt></ruby><ruby>書<rt>かき</rt></ruby><ruby>手数料<rt>てすうりょう</rt></ruby>そのものの<ruby>額<rt>がく</rt></ruby>」と<ruby>取<rt>と</rt></ruby>り<ruby>違<rt>ちが</rt></ruby>えている。remind ～ that … は「～に…のことを<ruby>念<rt>ねん</rt></ruby>のためお<ruby>伝<rt>つた</rt></ruby>えする」。<table class=\"vocab\"><thead><tr><th>English</th><th>日本語</th><th>中文</th></tr></thead><tbody><tr><td class=\"ven\">remind ～ that …</td><td class=\"vjp jp\">～に … のことを<ruby>思<rt>おも</rt></ruby>い<ruby>出<rt>だ</rt></ruby>させる</td><td class=\"vzh\">提醒…注意…</td></tr><tr><td class=\"ven\">additional</td><td class=\"vjp jp\"><ruby>追加<rt>ついか</rt></ruby>の</td><td class=\"vzh\">追加的</td></tr><tr><td class=\"ven\">chargeable</td><td class=\"vjp jp\"><ruby>課<rt>か</rt></ruby>せられる</td><td class=\"vzh\">应收取的、应负担的</td></tr><tr><td class=\"ven\">other than …</td><td class=\"vjp jp\">～<ruby>以外<rt>いがい</rt></ruby>の</td><td class=\"vzh\">除…以外的</td></tr><tr><td class=\"ven\">not … but ～</td><td class=\"vjp jp\">…ではなく～</td><td class=\"vzh\">不是…而是…</td></tr><tr><td class=\"ven\">include …</td><td class=\"vjp jp\">～を<ruby>含<rt>ふく</rt></ruby>む</td><td class=\"vzh\">包含…</td></tr><tr><td class=\"ven\">fee</td><td class=\"vjp jp\"><ruby>料金<rt>りょうきん</rt></ruby></td><td class=\"vzh\">费用</td></tr><tr><td class=\"ven\">inspection certificate of quality</td><td class=\"vjp jp\"><ruby>品質<rt>ひんしつ</rt></ruby><ruby>検査証明<rt>けんさしょうめい</rt></ruby><ruby>書<rt>かき</rt></ruby></td><td class=\"vzh\">品质检验证明书</td></tr></tbody></table>", "eZh": "<b>【全文中译】</b>谨提醒贵公司：发票金额以外的追加应付费用并非 1,250 美元，而是含品质检验证明书费用在内的 1,520 美元。<div style=\"margin-top:6px\">not … but ～ 是「不是…而是…」。other than the invoice value 是「发票金额以外的」，B 译成“发票开具手续费以外的”是错的。C 把 1,250／1,520 美元误当成“品质检验证明书手续费本身的金额”。remind ~ that … 是「提醒…注意…」。</div>", "sJp": "<span class=\"ensent sm\">We have to remind you that the additional chargeable…</span>", "sZh": "英译日选择题", "wide": false}, {"id": "111/7-1", "exam": "111", "sec": 7, "no": 1, "pts": 5.0, "docHtml": "<div class=\"doc\"><div class=\"dochead\"><div><b>BILL OF LADING</b><div class=\"docsub\">PAN WORLD SHIPPING CO., LTD.</div></div><div class=\"docno\">B/L No.<br><b>PWJ2744901</b></div></div><div class=\"docgrid\"><div class=\"docbox\" style=\"grid-column:span 3\"><div class=\"doclab\">Shipper<span>托运人（发货人／出口商）</span></div><div class=\"docval\">TOKYO TRADING CO., LTD.<br>2-3 OTEMACHI 1-CHOME<br>CHIYODA-KU, TOKYO 100-0002<br>JAPAN</div></div><div class=\"docbox\" style=\"grid-column:span 3\"><div class=\"doclab\">Consignee<span>收货人</span></div><div class=\"docval\">TO ORDER OF SHIPPER</div></div><div class=\"docbox\" style=\"grid-column:span 3\"><div class=\"doclab\">Notify Party<span>到货通知方</span></div><div class=\"docval\">U.S. MOTORS, INC.<br>134 BRIDGE STREET<br>RIVERSIDE, CA 94971<br>U.S.A.</div></div><div class=\"docbox\" style=\"grid-column:span 3\"><div class=\"doclab\">Place of Receipt<span>收货地</span></div><div class=\"docval\">TOKYO CY</div></div><div class=\"docbox\" style=\"grid-column:span 2\"><div class=\"doclab\">Ocean Vessel<span>船名</span></div><div class=\"docval\">NEPTUNE</div></div><div class=\"docbox\" style=\"grid-column:span 1\"><div class=\"doclab\">Voy. No.<span>航次</span></div><div class=\"docval\">154W</div></div><div class=\"docbox\" style=\"grid-column:span 3\"><div class=\"doclab\">Port of Loading<span>装货港</span></div><div class=\"docval\">TOKYO, JAPAN</div></div><div class=\"docbox\" style=\"grid-column:span 2\"><div class=\"doclab\">Port of Discharge<span>卸货港</span></div><div class=\"docval\">LONG BEACH, U.S.A.</div></div><div class=\"docbox\" style=\"grid-column:span 2\"><div class=\"doclab\">Port of Delivery<span>交货地</span></div><div class=\"docval\">LONG BEACH CY</div></div><div class=\"docbox\" style=\"grid-column:span 2\"><div class=\"doclab\">Final Destination<br>(for the merchant's reference only)<span>最终目的地（仅供货主参考）</span></div><div class=\"docval\">—</div></div></div><div class=\"docside\">Particulars furnished by Shipper</div><table class=\"doctbl\"><thead><tr><th>Container No. / Seal No.<br>Marks &amp; Nos.<span>集装箱号／铅封号、唛头</span></th><th>No. of Containers<br>or Packages<span>集装箱／件数</span></th><th>Description of Goods<span>货物描述</span></th><th>Gross Weight (kgs.)<br>Measurement (M³)<span>毛重／体积</span></th></tr></thead><tbody><tr><td>PW7009622<br>JPW462577<br><br>USM IN DIA<br>LONG BEACH<br>S.N. NO. ME-112/24<br>C/NO. 1-400<br>MADE IN JAPAN</td><td>400 CARTONS<br>(1 x 40')</td><td>SHIPPER'S LOAD AND COUNT<br>SAID TO CONTAIN<br><br>400 UNITS OF MOTORCYCLE<br>ENGINES AS PER SALES<br>NOTE NO. USM-112/25<br>DATED OCT. 8, 2025</td><td>15,000 KGS<br>52.000 M3</td></tr></tbody></table><div class=\"docfreight\">FREIGHT PREPAID</div><div class=\"docfoot\">― 以下省略 ―</div><details class=\"fold docterms\"><summary>表面約款（英文＋中文対訳）／ 提单正面条款（英中对照）</summary><p class=\"ten\">RECEIVED by the Carrier from the Shipper in apparent good order and condition unless otherwise indicated herein, the Goods, or the container(s) or package(s) said to contain the cargo herein mentioned, to be carried subject to all the terms and conditions provided for on the face and back of this Bill of Lading by the vessel named herein or any substitute at the Carrier's opinion and/or other means of transport, from the place of receipt or the port of loading to the port of discharge or the place of delivery shown herein and there to be delivered unto order or assigns.</p><p class=\"tzh\">承运人已从托运人处收到下述货物，或据称装有本提单所载货物的集装箱／件货，除本提单另有批注外，外表状况良好。货物将依照本提单正面及背面所载全部条款与条件，由本提单载明的船舶（或承运人认为适当的替代船舶）及／或其他运输方式，自收货地或装货港运至本提单所示的卸货港或交货地，并在该处交付给指定人或受让人。</p><p class=\"ten\">If required by the Carrier, this Bill of Lading duly endorsed must be surrendered in exchange for the Goods or delivery order.</p><p class=\"tzh\">承运人要求时，须将经正式背书的本提单交回，以换取货物或提货单（D/O）。</p><p class=\"ten\">In accepting this Bill of Lading, the Merchant agrees to be bound by all the stipulations, exceptions, terms and conditions on the face and back hereof, whether written, typed, stamped or printed, as fully as if signed by the Merchant, any local custom or privilege to the contrary notwithstanding, and agrees that all agreements or freight engagements for and in connection with the carriage of the Goods are superseded by this Bill of Lading.</p><p class=\"tzh\">货方（Merchant）接受本提单，即视为同意受本提单正面及背面所有约定、免责、条款与条件的约束——无论其为手写、打字、盖章或印刷，效力与货方签署无异，且不论当地是否存在相反的习惯或特权；并同意与本货物运输有关的一切协议或运费约定均由本提单取代。</p><p class=\"ten\">In witness whereof, the undersigned, on behalf of Nippon Yusen Kaisha, the Master and the owner of the Vessel, has signed the number of Bill(s) of Lading stated under, all of this tenor and date, one of which being accomplished, the others to stand void.</p><p class=\"tzh\">为此，下述签署人代表日本邮船株式会社、船长及船舶所有人，签发下列份数的提单，各份文义与日期相同；其中一份完成提货后，其余各份即告失效。</p><p class=\"ten\">(Terms of Bill of Lading continued on the back hereof)</p><p class=\"tzh\">（提单条款续见背面）</p></details></div>", "qHtml": "この<ruby>船荷<rt>ふなに</rt></ruby><ruby>証券<rt>しょうけん</rt></ruby>の<ruby>貨物<rt>かもつ</rt></ruby>の<ruby>種類<rt>しゅるい</rt></ruby>として、<ruby>正<rt>ただ</rt></ruby>しいものは<ruby>次<rt>つぎ</rt></ruby>のどれか。", "qZh": "关于这份提单所载货物的种类，正确的是下列哪一项？", "opts": [{"html": "<ruby>在来船<rt>ざいらいせん</rt></ruby>の<ruby>直<rt>ちょく</rt></ruby>（<ruby>自家<rt>じか</rt></ruby>）<ruby>積<rt>づみ</rt></ruby><ruby>貨物<rt>かもつ</rt></ruby>", "zh": "杂货船（传统船）的直装（自装）货物"}, {"html": "コンテナ<ruby>船<rt>せん</rt></ruby>のFCL<ruby>貨物<rt>かもつ</rt></ruby>", "zh": "集装箱船的整箱（FCL）货物"}, {"html": "コンテナ<ruby>船<rt>せん</rt></ruby>のLCL<ruby>貨物<rt>かもつ</rt></ruby>", "zh": "集装箱船的拼箱（LCL）货物"}], "ans": 1, "eHtml": "<ruby>貨物<rt>かもつ</rt></ruby>は<ruby>東京港<rt>とうきょうこう</rt></ruby>のコンテナ・ヤード（Place of Receipt：TOKYO CY）で<ruby>船会社<rt>ふながいしゃ</rt></ruby>に<ruby>引渡<rt>ひきわたし</rt></ruby>され、ロングビーチのコンテナ・ヤード（Port of Delivery：LONG BEACH CY）で<ruby>荷主<rt>にぬし</rt></ruby><ruby>側<rt>がわ</rt></ruby>に<ruby>荷渡<rt>にわたし</rt></ruby>しされていることから、コンテナ<ruby>貨物<rt>かもつ</rt></ruby>であることが<ruby>判<rt>わか</rt></ruby>る。また、Description of Goods <ruby>欄<rt>らん</rt></ruby>に「SHIPPER'S LOAD AND COUNT, SAID TO CONTAIN」という<ruby>不知<rt>ふち</rt></ruby><ruby>文言<rt>もんごん</rt></ruby>が<ruby>記載<rt>きさい</rt></ruby>されていることから FCL <ruby>貨物<rt>かもつ</rt></ruby>であることが<ruby>判<rt>わか</rt></ruby>る（LCL <ruby>貨物<rt>かもつ</rt></ruby>の<ruby>場合<rt>ばあい</rt></ruby>にはこのリマークは<ruby>挿入<rt>そうにゅう</rt></ruby>されない）。<ruby>更<rt>さら</rt></ruby>に、No. of Containers or Packages <ruby>欄<rt>らん</rt></ruby>に「(1 × 40'：40フィート・コンテナ1<ruby>本<rt>ほん</rt></ruby>)」とあることからも FCL <ruby>貨物<rt>かもつ</rt></ruby>であると<ruby>判断<rt>はんだん</rt></ruby>できる。FCL とは Full Container Load の<ruby>略<rt>りゃく</rt></ruby>で、<ruby>中<rt>なか</rt></ruby>に<ruby>一<rt>いち</rt></ruby><ruby>荷主<rt>にぬし</rt></ruby>の<ruby>貨物<rt>かもつ</rt></ruby>しか<ruby>入<rt>はい</rt></ruby>っていない<ruby>状態<rt>じょうたい</rt></ruby>のコンテナ、つまり<ruby>一<rt>いち</rt></ruby><ruby>荷主<rt>にぬし</rt></ruby>の<ruby>貨物<rt>かもつ</rt></ruby>だけでコンテナを<ruby>満載<rt>まんさい</rt></ruby>できる<ruby>大口<rt>おおぐち</rt></ruby><ruby>貨物<rt>かもつ</rt></ruby>のことをいう。<ruby>一方<rt>いっぽう</rt></ruby> LCL とは Less than Container Load の<ruby>略<rt>りゃく</rt></ruby>で、<ruby>中<rt>なか</rt></ruby>に<ruby>複数<rt>ふくすう</rt></ruby>の<ruby>荷主<rt>にぬし</rt></ruby>の<ruby>貨物<rt>かもつ</rt></ruby>が<ruby>混載<rt>こんさい</rt></ruby>されている<ruby>状態<rt>じょうたい</rt></ruby>のコンテナ、つまり<ruby>一<rt>いち</rt></ruby><ruby>荷主<rt>にぬし</rt></ruby>の<ruby>貨物<rt>かもつ</rt></ruby>がコンテナ1<ruby>本<rt>ぽん</rt></ruby><ruby>分<rt>ぶん</rt></ruby>に<ruby>満<rt>み</rt></ruby>たない<ruby>小口<rt>こぐち</rt></ruby><ruby>貨物<rt>かもつ</rt></ruby>のことで、この<ruby>場合<rt>ばあい</rt></ruby>は CFS で<ruby>仕向地<rt>しむけち</rt></ruby>を<ruby>同<rt>おな</rt></ruby>じくする<ruby>他<rt>ほか</rt></ruby>の<ruby>荷主<rt>にぬし</rt></ruby>の<ruby>小口<rt>こぐち</rt></ruby><ruby>貨物<rt>かもつ</rt></ruby>と<ruby>同<rt>おな</rt></ruby>じコンテナに<ruby>混載<rt>こんさい</rt></ruby>される。", "eZh": "货物在东京港的集装箱堆场（Place of Receipt：TOKYO CY）交给船公司，并在长滩的集装箱堆场（Port of Delivery：LONG BEACH CY）交付给货方，由此可知这是集装箱货物。另外，货物描述栏中写有「SHIPPER'S LOAD AND COUNT, SAID TO CONTAIN（托运人装载并计数／据称内装）」这一不知条款，说明是整箱（FCL）货物——拼箱（LCL）货物不会加这条批注。再看件数栏写着「(1 × 40'：一个 40 英尺集装箱)」，也可判断为 FCL。FCL 是 Full Container Load 的缩写，指箱内只装一个货主货物的集装箱，即一个货主的货就能装满一整箱的大宗货物。LCL 则是 Less than Container Load 的缩写，指箱内拼装多个货主货物的集装箱，即某一货主的货量不足一整箱的小批量货物，这种情况下会在 CFS 与目的地相同的其他货主的零星货物拼装在同一个箱内。", "sJp": "この<ruby>船荷<rt>ふなに</rt></ruby><ruby>証券<rt>しょうけん</rt></ruby>の<ruby>貨物<rt>かもつ</rt></ruby>の<ruby>種類<rt>しゅるい</rt></ruby>として、<ruby>正<rt>ただ</rt></ruby>しいものは<ruby>次<rt>つぎ</rt></ruby>のどれか。", "sZh": "关于这份提单所载货物的种类，正确的是下列哪一项？", "wide": false}, {"id": "111/7-2", "exam": "111", "sec": 7, "no": 2, "pts": 5.0, "docHtml": "<div class=\"doc\"><div class=\"dochead\"><div><b>BILL OF LADING</b><div class=\"docsub\">PAN WORLD SHIPPING CO., LTD.</div></div><div class=\"docno\">B/L No ements for and in connection with the carriage of the Goods are superseded by this Bill of Lading.</p><p class=\"tzh\">货方（Merchant）接受本提单，即视为同意受本提单正面及背面所有约定、免责、条款与条件的约束——无论其为手写、打字、盖章或印刷，效力与货方签署无异，且不论当地是否存在相反的习惯或特权；并同意与本货物运输有关的一切协议或运费约定均由本提单取代。</p><p class=\"ten\">In witness whereof, the undersigned, on behalf of Nippon Yusen Kaisha, the Master and the owner of the Vessel, has signed the number of Bill(s) of Lading stated under, all of this tenor and date, one of which being accomplished, the others to stand void.</p><p class=\"tzh\">为此，下述签署人代表日本邮船株式会社、船长及船舶所有人，签发下列份数的提单，各份文义与日期相同；其中一份完成提货后，其余各份即告失效。</p><p class=\"ten\">(Terms of Bill of Lading continued on the back hereof)</p><p class=\"tzh\">（提单条款续见背面）</p></details></div>", "qHtml": "この<ruby>船荷<rt>ふなに</rt></ruby><ruby>証券<rt>しょうけん</rt></ruby>の<ruby>内容<rt>ないよう</rt></ruby>について、<ruby>誤<rt>あやま</rt></ruby>っているものは<ruby>次<rt>つぎ</rt></ruby>のどれか。", "qZh": "关于这份提单的内容，错误的是下列哪一项？", "opts": [{"html": "この<ruby>貨物<rt>かもつ</rt></ruby>の<ruby>荷送人<rt>におくりにん</rt></ruby>（<ruby>輸出者<rt>ゆしゅつしゃ</rt></ruby>）はTOKYO TRADING CO., LTD.である。", "zh": "该批货物的托运人（出口商）是 TOKYO TRADING CO., LTD.。"}, {"html": "<ruby>船会社<rt>ふながいしゃ</rt></ruby>はU.S. MOTORS, INC.に<ruby>貨物<rt>かもつ</rt></ruby>のArrival Noticeを<ruby>送<rt>おく</rt></ruby>る。", "zh": "船公司会把货物的到货通知（Arrival Notice）寄给 U.S. MOTORS, INC.。"}, {"html": "この<ruby>貨物<rt>かもつ</rt></ruby>は<ruby>荷送人<rt>におくりにん</rt></ruby>の<ruby>指図<rt>さしず</rt></ruby>を<ruby>受<rt>う</rt></ruby>けた<ruby>者<rt>もの</rt></ruby>によって<ruby>東京港<rt>とうきょうこう</rt></ruby>で<ruby>船積<rt>ふなづみ</rt></ruby>みされた。", "zh": "该批货物是由接受托运人指示的人在东京港装船的。"}], "ans": 2, "eHtml": "この<ruby>貨物<rt>かもつ</rt></ruby>の<ruby>荷送人<rt>におくりにん</rt></ruby>（Shipper：<ruby>輸出者<rt>ゆしゅつしゃ</rt></ruby>）は TOKYO TRADING CO., LTD. である。したがって<ruby>選択肢<rt>せんたくし</rt></ruby>@0@の<ruby>内容<rt>ないよう</rt></ruby>は<ruby>正<rt>ただ</rt></ruby>しい。Notify Party（<ruby>貨物<rt>かもつ</rt></ruby><ruby>到着<rt>とうちゃく</rt></ruby><ruby>案内<rt>あんない</rt></ruby><ruby>先<rt>さき</rt></ruby>）<ruby>欄<rt>らん</rt></ruby>に U.S. MOTORS, INC. とあるので、<ruby>船会社<rt>ふながいしゃ</rt></ruby>はここに Arrival Notice（<ruby>着荷<rt>ちゃくに</rt></ruby><ruby>通知<rt>つうち</rt></ruby>）を<ruby>送<rt>おく</rt></ruby>り、<ruby>貨物<rt>かもつ</rt></ruby>の<ruby>引取<rt>ひきとり</rt></ruby>を<ruby>促<rt>うなが</rt></ruby>す。したがって<ruby>選択肢<rt>せんたくし</rt></ruby>@1@の<ruby>内容<rt>ないよう</rt></ruby>は<ruby>正<rt>ただ</rt></ruby>しい。<ruby>荷送人<rt>におくりにん</rt></ruby>の<ruby>指図<rt>さしず</rt></ruby>を<ruby>受<rt>う</rt></ruby>けた<ruby>者<rt>もの</rt></ruby>（Order of Shipper）とは Consignee（<ruby>荷受人<rt>にうけにん</rt></ruby>）のことであり、<ruby>船積<rt>ふなづみ</rt></ruby>みをする<ruby>者<rt>もの</rt></ruby>ではない。したがって<ruby>選択肢<rt>せんたくし</rt></ruby>@2@の<ruby>内容<rt>ないよう</rt></ruby>は<ruby>誤<rt>あやま</rt></ruby>りである（<ruby>船積<rt>ふなづみ</rt></ruby>みをするのは<ruby>荷送人<rt>におくりにん</rt></ruby><ruby>荷送人<rt>におくりにん</rt></ruby><ruby>輸出者<rt>ゆしゅつしゃ</rt></ruby><ruby>側<rt>がわ</rt></ruby>）。", "eZh": "该批货物的托运人（Shipper：出口商）是 TOKYO TRADING CO., LTD.，因此选项@0@正确。到货通知方（Notify Party）栏写的是 U.S. MOTORS, INC.，所以船公司会把到货通知（Arrival Notice）寄到这里，催促提货，因此选项@1@正确。而「接受托运人指示的人（Order of Shipper）」指的是收货人（Consignee），并不是装船的人，因此选项@2@的说法错误（装船的是托运人＝出口商一方）。", "sJp": "この<ruby>船荷<rt>ふなに</rt></ruby><ruby>証券<rt>しょうけん</rt></ruby>の<ruby>内容<rt>ないよう</rt></ruby>について、<ruby>誤<rt>あやま</rt></ruby>っているものは<ruby>次<rt>つぎ</rt></ruby>のどれか。", "sZh": "关于这份提单的内容，错误的是下列哪一项？", "wide": false}]};

];

try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); persistent = true; }catch(e){ persistent = false; }

function blankDB(){ return {v:2, stats:{}, sessions:[], session:null, opts:{qorder:'orig', exam:'all'}}; }
let DB = blankDB();
function loadDB(){
  if(!persistent) return;
  try{ const r = localStorage.getItem(SKEY); if(r){ const d=JSON.parse(r); if(d&&d.stats) DB=d; } }
  catch(e){ persistent=false; }
  if(!DB.opts) DB.opts={};
  if(!QMODES.some(m=>m.k===DB.opts.qorder)) DB.opts.qorder='orig';
  if(DB.opts.exam!=='all' && !EXBY[DB.opts.exam]) DB.opts.exam='all';
  migrateIds();
}
function saveDB(){
  if(!persistent) return;
  try{ localStorage.setItem(SKEY, JSON.stringify(DB)); }catch(e){ persistent=false; }
}
/* v1（期の概念が無い頃）のID "1-1" を "111/1-1" 形式へ移行 */
function migrateIds(){
  const def = EXAMS.length ? EXAMS[0].id : '111';
  let changed=false; const ns={};
  Object.keys(DB.stats||{}).forEach(k=>{
    const nk = k.indexOf('/')>=0 ? k : (def+'/'+k);
    if(nk!==k) changed=true;
    ns[nk] = DB.stats[k];
  });
  if(changed){ DB.stats=ns; DB.v=2; saveDB(); }
}
function st(id){
  if(!DB.stats[id]) DB.stats[id] = {n:0, ok:0, ng:0, ns:0, streak:0, book:false, grad:false, lastWrong:0, lastAt:0};
  if(DB.stats[id].ns===undefined) DB.stats[id].ns = 0;
  return DB.stats[id];
}
/* correct=正解 / unsure=「不清楚」を選んだ */
function recordAnswer(id, correct, unsure){
  const s = st(id); s.n++; s.lastAt = Date.now();
  if(correct){
    s.ok++;
    if(s.book){ s.streak++; if(s.streak >= GRAD_STREAK){ s.book=false; s.grad=true; s.streak=0; } }
  }else{
    if(unsure) s.ns++; else s.ng++;
    s.streak=0; s.book=true; s.grad=false; s.lastWrong = Date.now();
  }
  saveDB();
}
function bookIds(){ return DATA.questions.filter(q=>DB.stats[q.id] && DB.stats[q.id].book).map(q=>q.id); }
function missed(s){ return (s.ng||0) + (s.ns||0); }
function everWrongIds(){ return DATA.questions.filter(q=>DB.stats[q.id] && missed(DB.stats[q.id])>0).map(q=>q.id); }

}

  DB.session = {
    t: Date.now(),
    ids: pool.map(qi=>DATA.questions[qi].id),
    order: order,
    picked: picked,
    cur: cur,
    mode: (mode==='review' ? 'book' : mode),
    logged: sessionLogged,
  };
  saveDB();
}
function restoreSession(){
  const s = DB.session;
  if(!s || !Array.isArray(s.ids) || !s.ids.length) return false;
  const idx = s.ids.map(id=>QBY[id]);
  if(idx.some(v=>v===undefined)) return false;                       // 問題データが変わった
  if(!Array.isArray(s.order) || s.order.length!==idx.length) return false;
  for(let i=0;i<idx.length;i++){
    const q=DATA.questions[idx[i]];
    if(!Array.isArray(s.order[i]) || s.order[i].length!==q.opts.length) return false;
  }
  if(!Array.isArray(s.picked) || s.picked.length!==idx.length) return false;
  for(let i=0;i<idx.length;i++){
    const q=DATA.questions[idx[i]];
    if(q.multi){ if(!Array.isArray(s.picked[i]) || s.picked[i].length!==q.blanks.length) return false; }
    else if(Array.isArray(s.picked[i])) return false;
  }
  pool=idx; order=s.order; picked=s.picked;
  cur=Math.min(Math.max(0, s.cur|0), pool.length-1);
  mode=(s.mode==='result'||s.mode==='book')?s.mode:'quiz';
  sessionLogged=!!s.logged;
  activeBlank=null; activeFor=-1;
  restoredAt=s.t||0;
  render();
  return true;
}
function resetSession(){
  restoredAt=null; noticeOff={}; resetArmed=false;
  DB.session=null; saveDB();
  startAll();
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 出題順モードに従って並べ替える */
function orderedIndices(indices){
  const m = DB.opts.qorder;
  if(m==='all') return shuffle(indices.slice());
  if(m==='sec'){
    const g={}, seq=[];
    indices.slice().sort((a,b)=>a-b).forEach(qi=>{
      const s=DATA.questions[qi].sec;
      if(!g[s]){ g[s]=[]; seq.push(s); }
      g[s].push(qi);
    });
    let out=[]; seq.forEach(s=>{ out=out.concat(shuffle(g[s])); }); return out;
  }
  return indices.slice().sort((a,b)=>a-b);   // orig：原本の並び
}

/* 設定変更時、回答済みの内容を保ったまま並べ替える */
function reorderNow(){
  if(!pool.length) return;
  const keepQi = pool[cur], mo={}, mp={};
  pool.forEach((qi,i)=>{ mo[qi]=order[i]; mp[qi]=picked[i]; });
  pool = orderedIndices(pool);
  order = pool.map(qi=>mo[qi]);
  picked = pool.map(qi=>mp[qi]);
  const p = pool.indexOf(keepQi); cur = p<0 ? 0 : p;
  activeBlank=null; activeFor=-1;
}

function cycleQOrder(){
  const i = QMODES.findIndex(m=>m.k===DB.opts.qorder);
  DB.opts.qorder = QMODES[(i+1) % QMODES.length].k;
  saveDB(); reorderNow(); render();
}

function start(indices){
  if(!indices.length) return;
  pool = orderedIndices(indices);
  order = pool.map(qi => shuffle(DATA.questions[qi].opts.map((_,k)=>k)));
  picked = pool.map(qi=>{ const q=DATA.questions[qi]; return q.multi ? q.blanks.map(()=>null) : null; });
  cur=0; mode='quiz'; sessionLogged=false; confirmMode=null; restoredAt=null; resetArmed=false;
  activeBlank=null; activeFor=-1;
  render();
}
function examPool(){
  const e = DB.opts.exam;
  return DATA.questions.map((_,k)=>k).filter(k => e==='all' || DATA.questions[k].exam===e);
}
function startAll(){ start(examPool()); }
function cycleExam(){
  if(EXAMS.length<2) return;
  const seq = ['all'].concat(EXAMS.map(e=>e.id));
  DB.opts.exam = seq[(seq.indexOf(DB.opts.exam)+1) % seq.length];
  saveDB(); startAll();
}
function poolExams(){ return [...new Set(pool.map(qi=>DATA.questions[qi].exam))]; }
function startIds(ids){ start(ids.map(id=>QBY[id]).filter(v=>v!==undefined)); }

const UNSURE = -1;

/* --- 単問 / 複数空欄（語群選択式）を共通に扱うヘルパ --- */
function nBlanks(q){ return q.multi ? q.blanks.length : 1; }
function ansArr(i){ const q=DATA.questions[pool[i]];
  return q.multi ? (Array.isArray(picked[i])?picked[i]:q.blanks.map(()=>null)) : [picked[i]]; }
function isDone(i){
  const q=DATA.questions[pool[i]];
  return q.multi ? (Array.isArray(picked[i]) && picked[i].length===q.blanks.length && picked[i].every(v=>v!==null))
                 : picked[i]!==null;
}
function blankOk(i, k){
  const q=DATA.questions[pool[i]], a=ansArr(i);
  if(a[k]===null || a[k]===undefined || a[k]<0) return false;
  return order[i][a[k]] === (q.multi ? q.blanks[k].ans : q.ans);
}
function unitsOk(i){
  const q=DATA.questions[pool[i]];
  let n=0; for(let k=0;k<nBlanks(q);k++) if(blankOk(i,k)) n++;
  return n;
}
function isCorrect(i){ return isDone(i) && unitsOk(i)===nBlanks(DATA.questions[pool[i]]); }
function isUnsure(i){ return ansArr(i).some(v=>v===UNSURE); }
function qGot(i){
  const q=DATA.questions[pool[i]];
  return q.pts / nBlanks(q) * unitsOk(i);
}
function unsureCount(){ let n=0; pool.forEach((_,i)=>{ if(isUnsure(i)) n++; }); return n; }
function answeredCount(){ let n=0; pool.forEach((_,i)=>{ if(isDone(i)) n++; }); return n; }
function gotPts(){ let s=0; pool.forEach((_,i)=>{ s+=qGot(i); }); return s; }
function totalPts(){ return pool.reduce((s,qi)=>s+DATA.questions[qi].pts,0); }
function unitsTotal(){ return pool.reduce((s,qi)=>s+nBlanks(DATA.questions[qi]),0); }
function unitsOkTotal(){ let s=0; pool.forEach((_,i)=>{ s+=unitsOk(i); }); return s; }
function fmt(n){ return (Math.round(n*100)/100).toString(); }
function resolveMarks(s, ord){ return s.replace(/@(\d)@/g,(m,d)=>{ const p=ord.indexOf(parseInt(d,10)); return p<0?m:LETTERS[p]; }); }

/* ===================== 描画 ===================== */
function render(){
  if(mode==='book')   return renderBook();
  if(mode==='review') return renderReview();
  if(mode==='result') return renderResult();
  renderQuiz();
}

function optionsHtml(q, ord, pickedPos, done){
  let h='';
  ord.forEach((origK,pos)=>{
    const o=q.opts[origK];
    let cls='opt', mark='';
    if(done){
      if(origK===q.ans){ cls+=' correct'; mark='<span class="mark">✓</span>'; }
      else if(pos===pickedPos){ cls+=' wrong'; mark='<span class="mark">✗</span>'; }
      else cls+=' dim';
    }
    const kk = q.keys ? q.keys[origK] : LETTERS[pos];
    h += `<button class="${cls}" ${done?'disabled':''} data-pos="${pos}">
      <span class="key">${kk}</span>
      <span class="otext"><span class="jp">${o.html}</span><span class="ozh">${o.zh}</span></span>${mark}</button>`;
  });
  return h;
}
/* 語群選択式：選択済みの語には印を付ける */
function optionsHtmlMulti(q, ord, a, done){
  const used = new Set(a.filter(v=>v!==null && v>=0));
  let h='';
  ord.forEach((origK,pos)=>{
    const o=q.opts[origK];
    const cls='opt'+(done?' dim':(used.has(pos)?' used':''));
    const kk = q.keys ? q.keys[origK] : LETTERS[pos];
    h += `<button class="${cls}" ${done?'disabled':''} data-pos="${pos}">
      <span class="key">${kk}</span>
      <span class="otext"><span class="jp">${o.html}</span><span class="ozh">${o.zh}</span></span>
      ${used.has(pos)?'<span class="mark used">✔</span>':''}</button>`;
  });
  return h;
}
/* 文章中の空欄を状態に応じて描画（lang: 'jp' | 'zh'） */
function paintBlanks(root, q, ord, a, act, lang, live, onPick){
  if(!root) return;
  root.querySelectorAll('.blk').forEach(el=>{
    const bno = parseInt(el.dataset.b,10);
    const k = q.blanks.findIndex(x=>x.no===bno);
    if(k<0) return;
    const b = q.blanks[k], v = (a[k]===undefined?null:a[k]);
    const txt = idx => lang==='jp' ? q.opts[idx].html : q.opts[idx].zh;
    if(v===null){
      el.className = 'blk' + (k===act?' cur':'') + (live?' clk':'');
      el.innerHTML = '（&nbsp;'+b.mark+'&nbsp;）';
      if(live && onPick) el.onclick = ()=>onPick(k);
    }else{
      const origK = v>=0 ? ord[v] : null;
      const ok = origK===b.ans, un = (v===UNSURE);
      el.className = 'blk filled ' + (ok?'ok':(un?'un':'ng'));
      let body;
      if(ok)      body = txt(b.ans);
      else if(un) body = '？<span class="arw">→</span><span class="cor">'+txt(b.ans)+'</span>';
      else        body = '<s>'+txt(origK)+'</s><span class="arw">→</span><span class="cor">'+txt(b.ans)+'</span>';
      el.innerHTML = '<span class="bmk">'+b.mark+'</span>'+body;
      el.onclick = null;
    }
  });
}
function expHtml(q, ord){
  return `<div class="exp"><div class="exph">解説 KAISETSU</div>
    <div class="expjp jp">${resolveMarks(q.eHtml,ord)}</div>
    <div class="zh">${resolveMarks(q.eZh,ord)}</div></div>`;
}
/* 語群選択式：答えた空欄から順に解説を積み上げる */
function expHtmlMulti(q, ord, a){
  let h='';
  q.blanks.forEach((b,k)=>{
    const v = (a[k]===undefined?null:a[k]);
    if(v===null) return;
    const origK = v>=0 ? ord[v] : null;
    const ok = origK===b.ans, un = (v===UNSURE);
    const key = q.keys ? q.keys[b.ans] : LETTERS[ord.indexOf(b.ans)];
    h += `<div class="bexp ${ok?'ok':(un?'un':'ng')}">
      <div class="bexph">空欄 ${b.mark}　${ok?'✓ 正解 / 正确':(un?'？ 不清楚':'✗ 不正解 / 错误')}
        <small>正解：(${key}) <span class="jp">${q.opts[b.ans].html}</span>／${q.opts[b.ans].zh}</small></div>
      <div class="expjp jp">${b.eHtml}</div>
      <div class="zh">${b.eZh}</div></div>`;
  });
  return h ? `<div class="exp"><div class="exph">解説 KAISETSU</div>${h}</div>` : '';
}
function tally(s){
  return `<span class="r">✓${s.ok}</span> <span class="w">✗${s.ng}</span>` + ((s.ns||0)?` <span class="u">？${s.ns}</span>`:'');
}
function statLine(id){
  const s=DB.stats[id];
  if(!s||!s.n) return '<span style="color:var(--muted)">初回 / 首次作答</span>';
  const dots = s.book ? ' · 连对 '+('●'.repeat(s.streak)+'○'.repeat(Math.max(0,GRAD_STREAK-s.streak))) : '';
  return `<span class="tally">累计 ${tally(s)}${dots}</span>`;
}

function renderQuiz(){
  const i=cur, qi=pool[i], q=DATA.questions[qi], done=isDone(i), multi=!!q.multi;
  const a = multi ? picked[i] : null;
  if(activeFor!==i){ activeFor=i; activeBlank=null; }
  let act = -1;
  if(multi && !done){
    act = (activeBlank!==null && a[activeBlank]===null) ? activeBlank : a.findIndex(v=>v===null);
    activeBlank = act;
  }
  const s=DB.stats[q.id];
  let flag='';
  if(s && s.book) flag='<span class="badge ngb">错题本</span>';
  else if(s && s.grad) flag='<span class="badge okb">已毕业</span>';

  let fb='', prog='';
  if(multi){
    const nb=q.blanks.length, filled=a.filter(v=>v!==null).length;
    if(!done){
      prog = `<div class="mprog">已填 <b>${filled} / ${nb}</b> 空　·　正在填 <span class="cue">空欄 ${q.blanks[act].mark}</span>
        <span style="font-weight:400">（点文中其它空格可切换 / 文中の空欄をクリックで切替）</span></div>`;
    }else{
      const uo=unitsOk(i), allok=uo===nb, un=isUnsure(i);
      fb = `<div class="fb ${allok?'ok':(un&&uo+a.filter(v=>v===UNSURE).length===nb?'un':'ng')}">
        <div class="fbhead">${allok?'✓ 全問正解 / 全部正确':(uo?'△ '+uo+' / '+nb+' 空正解':'✗ 不正解 / 全部错误')}
        <small>得点 ${fmt(qGot(i))} / ${fmt(q.pts)} 点（1空 ${fmt(q.pts/nb)}点）</small></div></div>`;
    }
    fb += expHtmlMulti(q, order[i], a);
  }else if(done){
    const ok=isCorrect(i), un=isUnsure(i), ansKey = q.keys ? q.keys[q.ans] : LETTERS[order[i].indexOf(q.ans)];
    const head = ok ? '✓ 正解 / 回答正确'
              : un ? '？ わからない / 不清楚　—　已记入错题本'
                   : '✗ 不正解 / 回答错误';
    fb = `<div class="fb ${ok?'ok':(un?'un':'ng')}"><div class="fbhead">${head}
      <small>正解は ${ansKey}（正确答案：${ansKey}）・配点 ${fmt(q.pts)}点${un?'（0点）':''}</small></div></div>` + expHtml(q, order[i]);
  }

  const unsureLabel = multi
    ? '？ この空欄がわからない　/　这个空格不清楚（记入错题本）'
    : '？ わからない・この問題を錯題本に入れる　/　不清楚 —— 直接看解析并记入错题本';

  document.getElementById('main').innerHTML = `<div class="card">
    <div class="meta">
      <span class="badge ex">${examLabel(q.exam)}</span>
      <span class="badge">${DATA.sections[q.sec].zh}</span>
      <span class="qno">第 ${q.no} 问${multi?'（'+q.rng+'）':''}</span>${flag}
      <span>配点 ${fmt(q.pts)} 点</span><span>· 全体 ${i+1} / ${pool.length}</span>
      <span style="margin-left:auto">${statLine(q.id)}</span>
    </div>
    ${q.docHtml||''}
    <div class="qjp jp">${q.qHtml}</div>
    ${q.qZh?`<div class="zh" id="qzh">${q.qZh}</div>`:''}
    ${q.prompt?`<div class="prompt"><div class="jp">${q.prompt}</div><div class="zh">${q.promptZh}</div></div>`:''}
    ${prog}
    <div class="opts ${q.wide?'wide':''}">${multi?optionsHtmlMulti(q,order[i],a,done):optionsHtml(q, order[i], picked[i], done)}</div>
    ${done?'':`<button class="btn unsure" id="unsureBtn">${unsureLabel}</button>`}
    ${fb}
  </div>`;

  function pickBlank(k){ activeBlank=k; render(); }
  if(multi){
    paintBlanks(document.querySelector('#main .qjp'), q, order[i], a, act, 'jp', !done, pickBlank);
    paintBlanks(document.getElementById('qzh'),      q, order[i], a, act, 'zh', !done, pickBlank);
  }

  function choose(pos){
    if(multi){
      if(done || act<0 || a[act]!==null) return;
      a[act]=pos;
      activeBlank = a.findIndex(v=>v===null);
      if(isDone(i)) recordAnswer(q.id, isCorrect(i), isUnsure(i));
      render();
      const el=document.querySelector('.bexp:last-of-type'); if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    }else{
      if(picked[i]!==null) return;
      picked[i]=pos;
      recordAnswer(q.id, isCorrect(i), pos===UNSURE);
      render();
      const el=document.querySelector('.fb'); if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
  }
  document.querySelectorAll('#main .opt').forEach(b=>
    b.addEventListener('click', ()=>choose(parseInt(b.dataset.pos,10))));
  const ub=document.getElementById('unsureBtn');
  if(ub) ub.addEventListener('click', ()=>choose(UNSURE));

  document.getElementById('prev').disabled=(i===0);
  const nx=document.getElementById('next');
  nx.disabled=false; nx.textContent=(i===pool.length-1)?'結果を見る / 查看成绩':'次へ →';
  document.getElementById('hint').textContent = done ? '次へ：Enter / →'
    : (q.wide ? '语群里点选答案　不清楚：0　次へ：Enter' : '答案键：1 / 2 / 3　不清楚：0　次へ：Enter');
  after();
}

function renderReview(){
  const q=DATA.questions[reviewIdx], ord=q.opts.map((_,k)=>k), multi=!!q.multi;
  const a = multi ? q.blanks.map(b=>b.ans) : null;   // 全て正解を入れた状態
  const head = multi
    ? `正解：${q.blanks.map(b=>b.mark+' ('+(q.keys?q.keys[b.ans]:LETTERS[b.ans])+')').join('　')}`
    : `正解は ${q.keys ? q.keys[q.ans] : LETTERS[q.ans]}`;
  document.getElementById('main').innerHTML = `<div class="card">
    <div class="meta"><span class="badge ex">${examLabel(q.exam)}</span><span class="badge">${DATA.sections[q.sec].zh}</span>
      <span class="qno">第 ${q.no} 问${multi?'（'+q.rng+'）':''}</span>
      <span class="badge okb">解析モード / 只看解析</span>
      <span style="margin-left:auto">${statLine(q.id)}</span></div>
    ${q.docHtml||''}
    <div class="qjp jp">${q.qHtml}</div>
    ${q.qZh?`<div class="zh" id="qzh">${q.qZh}</div>`:''}
    ${q.prompt?`<div class="prompt"><div class="jp">${q.prompt}</div><div class="zh">${q.promptZh}</div></div>`:''}
    <div class="opts ${q.wide?'wide':''}">${multi?optionsHtmlMulti(q,ord,[],true):optionsHtml(q, ord, null, true)}</div>
    <div class="fb ok"><div class="fbhead">${head}　<small>配点 ${fmt(q.pts)}点</small></div></div>
    ${multi?expHtmlMulti(q, ord, a):expHtml(q, ord)}
    <div class="row" style="margin-top:18px"><button class="btn" id="backBook">← 返回错题本 / 錯題本へ戻る</button></div>
  </div>`;
  if(multi){
    paintBlanks(document.querySelector('#main .qjp'), q, ord, a, -1, 'jp', false, null);
    paintBlanks(document.getElementById('qzh'),      q, ord, a, -1, 'zh', false, null);
  }
  document.getElementById('backBook').addEventListener('click',()=>{ mode='book'; render(); });
  document.getElementById('prev').disabled=true;
  const nx=document.getElementById('next'); nx.disabled=true; nx.textContent='次へ →';
  document.getElementById('hint').textContent='';
  after();
}

function renderResult(){
  const total=totalPts(), got=gotPts(), nOk=unitsOkTotal(), nUn=unsureCount();
  if(!sessionLogged && answeredCount()===pool.length){
    DB.sessions.unshift({t:Date.now(), got:got, total:total, n:pool.length, ok:nOk, un:nUn});
    DB.sessions = DB.sessions.slice(0,30); sessionLogged=true; saveDB();
  }
  const agg={};
  pool.forEach((qi,i)=>{ const q=DATA.questions[qi], sj=DATA.sections[q.sec].subj;
    const u=nBlanks(q), uo=unitsOk(i), g=qGot(i);
    [['x|'+q.exam],['s|'+q.exam+'|'+sj],['c|'+q.exam+'|'+q.sec]].forEach(([k])=>{
      const b=agg[k]=agg[k]||{n:0,ok:0,pts:0,got:0};
      b.n+=u; b.pts+=q.pts; b.ok+=uo; b.got+=g; }); });
  const pc=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  const cells=b=>`<td class="num">${b.ok} / ${b.n}</td><td class="num">${fmt(b.got)} / ${fmt(b.pts)}</td><td class="num">${pc(b.got,b.pts)}</td>`;
  const exList = poolExams();
  let rows='';
  exList.forEach(ex=>{
    if(exList.length>1 && agg['x|'+ex])
      rows += `<tr class="exrow"><td>${examLabel(ex)}<span style="color:var(--muted);font-weight:400;font-size:12px"> / ${EXBY[ex]?EXBY[ex].jp:''}</span></td>${cells(agg['x|'+ex])}</tr>`;
    SUBJS.forEach(sj=>{
      const u=agg['s|'+ex+'|'+sj]; if(!u) return;
      const sm=DATA.subjects[sj];
      rows += `<tr class="subj"><td style="padding-left:${exList.length>1?18:0}px">${sm.zh}<span style="color:var(--muted);font-weight:400;font-size:12px"> / ${sm.jp}</span></td>${cells(u)}</tr>`;
      SECS.filter(x=>DATA.sections[x].subj===sj && agg['c|'+ex+'|'+x]).forEach(x=>{ const b=agg['c|'+ex+'|'+x];
        rows += `<tr><td style="padding-left:${(exList.length>1?18:0)+22}px">${DATA.sections[x].zh}<br><span style="color:var(--muted);font-size:12px">${DATA.sections[x].jp}</span></td>${cells(b)}</tr>`; });
    });
  });
  rows += `<tr class="tot"><td>合計 / 总计</td><td class="num">${nOk} / ${unitsTotal()}</td>
    <td class="num">${fmt(got)} / ${fmt(total)}</td><td class="num">${pc(got,total)}</td></tr>`;

  const isFull = (exList.length===1 && pool.length===EXBY[exList[0]].n);
  const passed = isFull && got>=PASS_PTS;
  const verdict = isFull
    ? `<span class="verdict ${passed?'pass':'fail'}">${passed?'合格ライン到達 / 达到及格线':'合格ラインまで '+fmt(PASS_PTS-got)+' 点 / 距及格线还差 '+fmt(PASS_PTS-got)+' 分'}</span>`
    : `<span class="verdict" style="background:#f0efec;color:var(--muted)">練習モード（一部の問題）/ 练习模式（部分题目）</span>`;

  const gsec={};
  pool.forEach((qi,i)=>{ const q=DATA.questions[qi]; (gsec[q.sec]=gsec[q.sec]||[]).push([q.no,i]); });
  let grid='';
  Object.keys(gsec).sort().forEach(s=>{
    grid += `<div class="gsec">${DATA.sections[s].zh}</div><div class="grid">` +
      gsec[s].sort((a,b)=>a[0]-b[0]).map(([no,i])=>
        `<button class="cellbtn ${!isDone(i)?'':(isCorrect(i)?'ok':(isUnsure(i)&&unitsOk(i)+ansArr(i).filter(v=>v===UNSURE).length===nBlanks(DATA.questions[pool[i]])?'un':'ng'))}" data-i="${i}">${no}</button>`).join('') + '</div>';
  });

  const wrongIdx=pool.filter((_,i)=>isDone(i) && !isCorrect(i));
  const nAns=answeredCount(), nSkip=pool.length-nAns;
  const nUnitsAns=pool.reduce((s2,qi,i)=>s2+(isDone(i)?nBlanks(DATA.questions[qi]):0),0);
  const nNg=nUnitsAns-nOk-pool.reduce((s2,_,i)=>s2+ansArr(i).filter(v=>v===UNSURE).length,0);
  const nUnBlanks=pool.reduce((s2,_,i)=>s2+ansArr(i).filter(v=>v===UNSURE).length,0);
  const nb=bookIds().length;

  document.getElementById('main').innerHTML = `<div class="card res">
    <h2>成績表 / 成绩单<span class="h2sub">${exList.length===1?examLabel(exList[0]):'跨期练习 / 複数回'}</span></h2>
    <div class="sub">本試験の合格基準は「2科目合計 160／200点（80%）を基準として試験委員長の定める点」｜正式考试及格基准：两科合计 160／200 分（80%）</div>
    <div class="big">${fmt(got)}<small> / ${fmt(total)} 点　（${Math.round(got/total*100)}%）</small>${verdict}</div>
    <div style="color:var(--muted);font-size:13px;margin-top:6px">正解 ${nOk} / ${nUnitsAns} 小问（全 ${unitsTotal()} 小问・${pool.length} 题）　·　本次答错 ${nNg} 小问、不清楚 ${nUnBlanks} 小问，相关题目均已记入错题本（当前错题本共 ${nb} 题）${nSkip?'　·　未作答 '+nSkip+' 题':''}</div>
    <table class="tbl"><thead><tr><th>科目 / 科目</th><th class="num">正解数（小問）</th><th class="num">得点</th><th class="num">正答率</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="font-size:12px;color:var(--muted);font-weight:600">题目一览（点击可回看解析 / クリックで解説へ）</div>
    ${grid}
    <div class="row" style="margin-top:22px">
      <button class="btn pri" id="again">全部重做 / もう一度</button>
      ${wrongIdx.length?`<button class="btn" id="wrongOnly">重做本次错题・不清楚（${wrongIdx.length} 题）</button>`:''}
      ${nb?`<button class="btn danger" id="toBook">打开错题本（${nb} 题）</button>`:''}
    </div>
    <div class="note">※ 出典：貿易実務検定<sup>®</sup>C級「貿易実務」「貿易英語」問題・解答（アップロードされたPDF）。選択肢の並び順は毎回シャッフルされます。<br>
    ※ 本页仅供个人学习使用。原始教材版权归日本贸易实务检定协会<sup>®</sup>／株式会社マウンハーフジャパン所有，请勿转让、转售、再分发。</div>
  </div>`;

  document.querySelectorAll('.cellbtn').forEach(b=>b.addEventListener('click',()=>{ cur=parseInt(b.dataset.i,10); mode='quiz'; render(); }));
  document.getElementById('again').addEventListener('click', startAll);
  const w=document.getElementById('wrongOnly'); if(w) w.addEventListener('click',()=>start(wrongIdx));
  const t=document.getElementById('toBook'); if(t) t.addEventListener('click',()=>{ mode='book'; render(); });

  document.getElementById('prev').disabled=false;
  const nx=document.getElementById('next'); nx.disabled=true; nx.textContent='次へ →';
  document.getElementById('hint').textContent='';
  after();
}

/* ---------- 錯題本 ---------- */
function bkRow(id, graduated){
  const qi=QBY[id], q=DATA.questions[qi], s=st(id);
  const dots = graduated ? '' : ` · <span class="dots">${'●'.repeat(s.streak)}${'○'.repeat(Math.max(0,GRAD_STREAK-s.streak))}</span> 再连对 ${Math.max(0,GRAD_STREAK-s.streak)} 次毕业`;
  return `<div class="bkrow ${graduated?'grad':''}">
    <div class="bkhead">
      <span class="badge ex">${examLabel(q.exam)}</span>
      <span class="badge ${graduated?'okb':'ngb'}">${DATA.sections[q.sec].zh}</span>
      <span class="n">第 ${q.no} 问</span>
      <span class="tally">${tally(s)}</span>
      <span>最后答错 ${tstamp(s.lastWrong)}${dots}</span>
    </div>
    <div class="bkq jp">${q.sJp}</div>
    <div class="bkzh">${q.sZh}</div>
    <div class="bkacts">
      <button class="btn sm" data-act="rev" data-id="${id}">查看解析</button>
      <button class="btn sm" data-act="one" data-id="${id}">只做这题</button>
      ${graduated?'':`<button class="btn sm" data-act="del" data-id="${id}">移出错题本</button>`}
    </div></div>`;
}

function renderBook(){
  const ids=bookIds(), grads=gradIds();
  const allN=Object.keys(DB.stats).length;
  let totN=0, totOk=0, totUn=0; Object.values(DB.stats).forEach(s=>{ totN+=s.n; totOk+=s.ok; totUn+=(s.ns||0); });
  const unIds = ids.filter(id=>(DB.stats[id].ns||0)>0);
  const rate = totN?Math.round(totOk/totN*100):0;

  const byEx={}; ids.forEach(id=>{ const q=DATA.questions[QBY[id]]; ((byEx[q.exam]=byEx[q.exam]||{})[q.sec]=(byEx[q.exam][q.sec]||[])).push(id); });
  let list='';
  if(ids.length){
    EXAMS.map(e=>e.id).filter(e=>byEx[e]).forEach(ex=>{
      const cnt = Object.values(byEx[ex]).reduce((a,b)=>a+b.length,0);
      if(EXAMS.length>1)
        list += `<div class="exhead"><span>${examLabel(ex)}　共 ${cnt} 题</span>
          <button class="btn sm" data-act="drillex" data-id="${ex}">重做本期错题</button></div>`;
      Object.keys(byEx[ex]).sort().forEach(s=>{
        list += `<div class="bkgrp">${DATA.sections[s].zh}（${byEx[ex][s].length} 题）</div>` + byEx[ex][s].map(id=>bkRow(id,false)).join('');
      });
    });
  }else{
    list = `<div class="empty"><span class="em">🎉</span>错题本是空的。<br>错题本にはまだ問題がありません。</div>`;
  }

  const histRows = DB.sessions.slice(0,8).map(x=>
    `<div class="hist">· <span>${tstamp(x.t)}</span> ｜ ${x.n} 题 ｜ 正解 <span>${x.ok}</span>${x.un?'（不清楚 '+x.un+'）':''} ｜ 得分 <span>${fmt(x.got)}/${fmt(x.total)}</span>（${Math.round(x.got/x.total*100)}%）</div>`).join('')
    || '<div class="hist" style="color:var(--muted)">还没有完成过整套测验。</div>';

  let confirmBox='';
  if(confirmMode==='book') confirmBox = `<div class="banner">确定要<b>清空错题本</b>吗？（答题统计和历史记录会保留）<div class="row" style="margin-top:8px"><button class="btn sm danger" id="doBook">确定清空</button><button class="btn sm" id="noConf">取消</button></div></div>`;
  if(confirmMode==='all')  confirmBox = `<div class="banner">确定要<b>重置全部记录</b>吗？错题本、每题的对错统计、历史成绩都会被删除，且无法恢复。<div class="row" style="margin-top:8px"><button class="btn sm danger" id="doAll">确定重置全部</button><button class="btn sm" id="noConf">取消</button></div></div>`;

  document.getElementById('main').innerHTML = `<div class="card bk">
    <h2>错题本 / 錯題本</h2>
    <div class="sub">答错、或选了<b>「不清楚」</b>的题会自动进来；<b>连续答对 ${GRAD_STREAK} 次</b>即自动毕业移出（中途再错则重新计数）。当前题库：${EXAMS.map(e=>e.zh+'（'+e.n+'题）').join('、')}</div>
    ${persistent?'':`<div class="banner">⚠️ 当前环境不支持自动保存（例如在应用侧栏中打开）。记录只在本次会话内有效——请用下方的<b>「导出记录」</b>存成文件，下次<b>「导入记录」</b>即可续用。把 HTML 文件下载到电脑上、用浏览器直接打开，就能自动保存。</div>`}
    ${confirmBox}
    <div class="kpis">
      <div class="kpi ngk"><div class="v">${ids.length}</div><div class="k">当前错题<br>現在の錯題</div></div>
      <div class="kpi okk"><div class="v">${grads.length}</div><div class="k">已毕业<br>卒業した問題</div></div>
      <div class="kpi unk"><div class="v">${unIds.length}</div><div class="k">其中曾选「不清楚」<br>「わからない」を選んだ問題</div></div>
      <div class="kpi"><div class="v">${allN}</div><div class="k">做过的题<br>解いた問題数</div></div>
      <div class="kpi"><div class="v">${rate}%</div><div class="k">累计正确率（${totOk}/${totN}）<br>其中不清楚 ${totUn} 次</div></div>
    </div>
    <div class="row">
      ${ids.length?`<button class="btn pri" id="drill">重做错题（${ids.length} 题）</button>`:''}
      ${unIds.length?`<button class="btn" id="drillUn">只做曾「不清楚」的题（${unIds.length} 题）</button>`:''}
      ${everWrongIds().length?`<button class="btn" id="drillAll">重做所有错过的题（${everWrongIds().length} 题）</button>`:''}
      <button class="btn" id="toAll">重做整套（${examPool().length} 题${DB.opts.exam==='all'?'':'・'+examLabel(DB.opts.exam)}）</button>
    </div>
    ${list}
    ${grads.length?`<details class="fold"><summary>已毕业的题目（${grads.length} 题）</summary>${grads.map(id=>bkRow(id,true)).join('')}</details>`:''}
    <div class="bkgrp">历史成绩 / 成績履歴</div>
    ${histRows}
    <div class="dz">
      <b>记录的保存与重置</b>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="exp">导出记录（.json）</button>
        <button class="btn sm" id="imp">导入记录</button>
        <button class="btn sm danger" id="rstBook">清空错题本</button>
        <button class="btn sm danger" id="rstAll">重置全部记录</button>
      </div>
      保存位置：${persistent?'浏览器本地存储（localStorage），换浏览器或清理浏览数据后会丢失，建议定期导出备份。':'仅内存（本次会话）——请务必导出备份。'}
    </div>
  </div>`;

  document.querySelectorAll('#main [data-act]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.id;
    if(b.dataset.act==='rev'){ reviewIdx=QBY[id]; mode='review'; render(); }
    else if(b.dataset.act==='one'){ startIds([id]); }
    else if(b.dataset.act==='del'){ const s=st(id); s.book=false; s.streak=0; saveDB(); render(); }
    else if(b.dataset.act==='drillex'){ startIds(bookIds().filter(x=>DATA.questions[QBY[x]].exam===id)); }
  }));
  const g=id=>document.getElementById(id);
  if(g('drill')) g('drill').addEventListener('click',()=>startIds(bookIds()));
  if(g('drillUn')) g('drillUn').addEventListener('click',()=>startIds(unIds));
  if(g('drillAll')) g('drillAll').addEventListener('click',()=>startIds(everWrongIds()));
  g('toAll').addEventListener('click', startAll);
  g('exp').addEventListener('click', exportDB);
  g('imp').addEventListener('click', ()=>document.getElementById('fileIn').click());
  g('rstBook').addEventListener('click',()=>{ confirmMode='book'; render(); window.scrollTo({top:0}); });
  g('rstAll').addEventListener('click',()=>{ confirmMode='all'; render(); window.scrollTo({top:0}); });
  if(g('noConf')) g('noConf').addEventListener('click',()=>{ confirmMode=null; render(); });
  if(g('doBook')) g('doBook').addEventListener('click',()=>{
    Object.values(DB.stats).forEach(s=>{ s.book=false; s.streak=0; }); confirmMode=null; saveDB(); render(); });
  if(g('doAll')) g('doAll').addEventListener('click',()=>{ DB=blankDB(); confirmMode=null; restoredAt=null; saveDB(); startAll(); });

  document.getElementById('prev').disabled=true;
  const nx=document.getElementById('next'); nx.disabled=true; nx.textContent='次へ →';
  document.getElementById('hint').textContent='';
  after();
}

/* ---------- 導入・導出 ---------- */
function exportDB(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a'); const p=n=>String(n).padStart(2,'0'); const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download=`貿易実務C級_学習記録_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
document.getElementById('fileIn').addEventListener('change', ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d || typeof d!=='object' || !d.stats) throw 0;
      const qo = (d.opts && QMODES.some(m=>m.k===d.opts.qorder)) ? d.opts.qorder : DB.opts.qorder;
      const ex = (d.opts && (d.opts.exam==='all' || EXBY[d.opts.exam])) ? d.opts.exam : DB.opts.exam;
      DB={v:2, stats:d.stats||{}, sessions:Array.isArray(d.sessions)?d.sessions:[],
          session:(d.session||null), opts:{qorder:qo, exam:ex}};
      Object.values(DB.stats).forEach(s=>{ s.n=s.n||0; s.ok=s.ok||0; s.ng=s.ng||0; s.ns=s.ns||0; s.streak=s.streak||0; });
      saveDB(); restoredAt=null; restoreSession(); mode='book'; render();
    }catch(e){ alert('文件格式不正确 / ファイル形式が不正です'); }
  };
  r.readAsText(f); ev.target.value='';
});

/* ---------- 通知バー ---------- */
function renderNotice(){
  let h='';
  if(!persistent && !noticeOff.store){
    h += `<div class="nbar warn"><b>⚠️ 当前环境无法保存进度</b>
      —— 浏览器存储被禁用（例如在应用侧栏中打开）。把 HTML 文件下载到电脑、用浏览器直接打开，答题进度和错题本就会自动保存。
      <span class="sp"></span><button class="nx" data-off="store">×</button></div>`;
  }
  if(restoredAt && !noticeOff.restore){
    h += `<div class="nbar info">已恢复上次的答题进度（${answeredCount()} / ${pool.length} 题　${tstamp(restoredAt)}）。
      想从头再来请点右下角的「⟳ 重新开始」。
      <span class="sp"></span><button class="nx" data-off="restore">×</button></div>`;
  }
  const el=document.getElementById('notice');
  el.innerHTML=h;
  el.querySelectorAll('.nx').forEach(b=>b.addEventListener('click',()=>{
    noticeOff[b.dataset.off]=true; renderNotice();
  }));
}

/* ---------- 共通 ---------- */
function after(){
  const inQuiz = (mode==='quiz');
  document.getElementById('hsub').textContent =
    `贸易实务检定 C 级 · 在线模拟考试　题库：${EXAMS.map(e=>e.zh).join('・')}（每期 贸易实务 65 题 150 分 ＋ 贸易英语 32 题 50 分 ＝ 200 分）`;
  document.getElementById('stat').innerHTML = inQuiz || mode==='result'
    ? `回答 <b>${answeredCount()}</b>/${pool.length}　得点 <b>${fmt(gotPts())}</b>/${fmt(totalPts())}`
    : `错题本 <b>${bookIds().length}</b> 题　已毕业 <b>${gradIds().length}</b> 题`;
  document.getElementById('bar').style.width = (answeredCount()/Math.max(1,pool.length)*100)+'%';

  const chips=document.getElementById('chips');
  const nb=bookIds().length;
  let h = `<button class="chip book${mode==='book'||mode==='review'?' on':''}" data-go="book">错题本${nb?' '+nb:''}</button>`;
  h += `<button class="chip${mode==='result'?' on':''}" data-go="result">成绩单</button>`;
  SECS.forEach(s=>{
    const first=pool.findIndex(qi=>DATA.questions[qi].sec===s);
    if(first<0) return;
    const on = mode==='quiz' && DATA.questions[pool[cur]].sec===s;
    h += `<button class="chip${on?' on':''}" data-go="${first}">${DATA.sections[s].short}</button>`;
  });
  const exLab = DB.opts.exam==='all' ? (EXAMS.length===1 ? EXAMS[0].zh : '期号：全部') : examLabel(DB.opts.exam);
  const multi = EXAMS.length>1;
  h += `<button class="chip set exsel${multi&&DB.opts.exam!=='all'?' act':''}" data-go="exam"
        title="${multi?'点击切换期号（全部 / 各期）':'当前题库只有 '+exLab+'，补录其它期后此处可切换'}"${multi?'':' disabled'}>📚 ${exLab}</button>`;
  const qm = QMODES.find(m=>m.k===DB.opts.qorder) || QMODES[0];
  h += `<button class="chip set${qm.k==='orig'?'':' act'}" data-go="qorder" title="${qm.tip}｜点击切换">🔀 ${qm.label}</button>`;
  chips.innerHTML=h;
  chips.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.go;
    if(v==='exam'){ cycleExam(); return; }
    if(v==='qorder'){ cycleQOrder(); return; }
    if(v==='book'){ confirmMode=null; mode='book'; }
    else if(v==='result'){ mode='result'; }
    else { cur=parseInt(v,10); mode='quiz'; }
    render();
  }));
  const rb=document.getElementById('reset');
  rb.textContent = resetArmed ? '⟳ 确定重新开始？' : '⟳ 重新开始';
  rb.classList.toggle('arm', resetArmed);
  document.getElementById('saved').textContent = persistent ? '进度已自动保存' : '⚠ 未保存';
  renderNotice();
  saveSession();
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('reset').addEventListener('click',()=>{
  if(!resetArmed){
    resetArmed=true;
    const rb=document.getElementById('reset');
    rb.textContent='⟳ 确定重新开始？'; rb.classList.add('arm');
    clearTimeout(resetTimer);
    resetTimer=setTimeout(()=>{ resetArmed=false; rb.textContent='⟳ 重新开始'; rb.classList.remove('arm'); }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetSession();
});

document.getElementById('prev').addEventListener('click',()=>{
  if(mode==='result'){ mode='quiz'; cur=pool.length-1; render(); return; }
  if(mode==='quiz' && cur>0){ cur--; render(); }
});
document.getElementById('next').addEventListener('click',()=>{
  if(mode!=='quiz') return;
  if(cur<pool.length-1){ cur++; render(); } else { mode='result'; render(); }
});
document.addEventListener('keydown', e=>{
  if(mode!=='quiz') return;
  if(e.key==='Enter'||e.key==='ArrowRight') document.getElementById('next').click();
  else if(e.key==='ArrowLeft') document.getElementById('prev').click();
  else if(e.key==='0' || e.key==='?'){
    const u=document.getElementById('unsureBtn'); if(u) u.click();
  }
  else if(/^[1-9]$/.test(e.key)){
    const b=document.querySelectorAll('#main .opt')[parseInt(e.key,10)-1];
    if(b && !b.disabled) b.click();
  }
});

if(!restoreSession()) startAll();
</script>
